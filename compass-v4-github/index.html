<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Compass"><meta name="description" content="A personal school dashboard prototype."><title>Compass</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='23' fill='none' stroke='%230b8dce' stroke-width='7'/%3E%3Cpath d='M38 20 34 38 24 44 28 26Z' fill='%230b8dce'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=4"></head><body>
